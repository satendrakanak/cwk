name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  client-check:
    name: Client Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://cwk.getkasa.in' }}
          NEXT_PUBLIC_API_BASE_URL: http://server:8000

  server-check:
    name: Server Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: CWK_DEPLOYMENT
    needs:
      - client-check
      - server-check
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '13.206.210.16' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/codewithkasa' }}
      DEPLOY_SSH_KEY_PRESENT: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    permissions:
      contents: read
    steps:
      - name: Validate deploy inputs
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is empty"; exit 1; }
          test -n "$DEPLOY_PORT" || { echo "DEPLOY_PORT is empty"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is empty"; exit 1; }
          test "$DEPLOY_SSH_KEY_PRESENT" = "true" || { echo "DEPLOY_SSH_KEY secret is empty"; exit 1; }

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 30m
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git fetch origin master
            git reset --hard origin/master
            docker compose --env-file .env -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
